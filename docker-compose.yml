version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: petrolead-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: petrolead
      POSTGRES_PASSWORD: petrolead
      POSTGRES_DB: petrolead
    ports:
      - "5432:5432"
    volumes:
      - petrolead_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petrolead -d petrolead"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: petrolead-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # Only load-bearing for Phase 10 (scheduled searches, via the `worker`
    # service below). Every other feature works with the API alone.

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petrolead-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://petrolead:petrolead@postgres:5432/petrolead
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petrolead-worker
    restart: unless-stopped
    command: celery -A app.worker worker --beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://petrolead:petrolead@postgres:5432/petrolead
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app
    # Runs scheduled searches (Phase 10) created via POST /api/saved-searches.
    # Everything else in the app works without this service running.

volumes:
  petrolead_postgres_data:
